<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>실제 피부과 사이트 화면 편집</title><style>*{box-sizing:border-box}html,body{margin:0;width:960px;height:540px;overflow:hidden}body{background:#eeece9;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:#736e66}.source{position:absolute;left:48px;top:7px;font-size:10px;letter-spacing:.03em;z-index:30}.scene{position:absolute;left:48px;top:28px;width:864px;height:486px;transform-origin:440.51765625px 63.45px;border-radius:7px;overflow:hidden;box-shadow:0 6px 25px #30272015;will-change:transform}.scene img{position:absolute;width:864px;height:486px;display:block}#treatments{visibility:hidden}#pointer{position:absolute;z-index:20;top:0;left:0;filter:drop-shadow(0 1px 1px #0003)}#ripple{position:absolute;z-index:19;top:0;left:0;width:26px;height:26px;border:1.5px solid #d7836d;border-radius:50%;opacity:0}#phase{position:absolute;bottom:7px;right:48px;font-size:10px;color:#8b8379}</style><div class="source">실제 사이트 화면 예시 · 출처 pecheskin.clinic</div><div class="scene" id="scene"><img src="source-home.png" alt="페슈의원 메인 화면"><img id="treatments" src="source-treatments.png" alt="페슈의원 전체 시술 화면"></div><svg id="pointer" width="24" height="30" viewBox="0 0 24 30"><path d="M3 2v23l6-6 4 9 4-2-4-8 8-1Z" fill="white" stroke="#292722" stroke-width="1.5" stroke-linejoin="round"/></svg><div id="ripple"></div><div id="phase">메인 화면</div><script>const scene=document.getElementById('scene'),treatments=document.getElementById('treatments'),pointer=document.getElementById('pointer'),ripple=document.getElementById('ripple'),phase=document.getElementById('phase');const clamp=v=>Math.max(0,Math.min(1,v)),ease=v=>{v=clamp(v);return v<.5?2*v*v:1-Math.pow(-2*v+2,2)/2},mix=(a,b,t)=>a+(b-a)*t;const tx=48+440.51765625,ty=28+63.45;window.setDemoTime=ms=>{ms=Math.max(0,Math.min(3999,ms));let scale=ms<1150?mix(1,3,ease((ms-450)/700)):ms<1550?3:mix(3,1,ease((ms-1550)/750));scene.style.transform=`scale(${scale})`;treatments.style.visibility=ms>=1400?'visible':'hidden';const moving=ease((ms-450)/650),leaving=ease((ms-1650)/650);const x=ms<1400?mix(650,tx,moving):mix(tx,850,leaving),y=ms<1400?mix(365,ty,moving):mix(ty,433,leaving);pointer.style.transform=`translate(${x}px,${y}px)`;let pulse=(ms-1250)/200;ripple.style.opacity=pulse>=0&&pulse<=1?String(.65*(1-pulse)):'0';ripple.style.transform=`translate(${x-13}px,${y-13}px) scale(${1+clamp(pulse)*.7})`;phase.textContent=ms<750?'메인 화면':ms<1400?'전체 시술 메뉴':'실제 시술 안내';window.demoState={time:ms,scale,view:ms>=1400?'treatments':'home'}};window.setDemoTime(0);</script></html>
