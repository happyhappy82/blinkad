<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>실제 피부과 사이트 GIF 검토</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0b0c0f;color:#f2f3f5;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;padding:36px 20px calc(96px + env(safe-area-inset-bottom))}main{max-width:960px;margin:auto}small{color:#8a9aaf;font-size:12px;letter-spacing:.08em}h1{font-size:clamp(24px,5vw,34px);letter-spacing:-.04em;margin:12px 0}p{color:#aab3c0;font-size:14px;line-height:1.65}figure{margin:24px 0 10px;border-radius:12px;overflow:hidden;background:#edf1f5}img{display:block;width:100%;height:auto}button,a{font:inherit;min-height:44px}button{border:1px solid #384457;background:#141a23;color:#eaf0f8;border-radius:7px;padding:0 14px;cursor:pointer}a{color:#a9cbff;text-decoration:none;display:inline-flex;align-items:center}a:focus-visible,button:focus-visible{outline:2px solid #8ab8f2;outline-offset:3px}.tools{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.meta{color:#8190a4;font-size:12px}nav{position:fixed;bottom:0;left:0;right:0;background:#0b0c0ff5;border-top:1px solid #253041;padding:8px 20px max(8px,env(safe-area-inset-bottom))}nav div{max-width:960px;margin:auto;display:flex;justify-content:space-between;gap:20px}nav a{font-size:14px;color:#d6dde7}</style></head>
<body><main><small>BLINKAD · GIF PREVIEW</small><h1>실제 피부과 사이트 GIF</h1><p>페슈의원 실제 메인 화면에서 전체 시술 메뉴를 선택하고, 진료 목록으로 이동하는 모습을 담았습니다.</p>
<figure><img id="demo" src="clinic-navigation.gif" width="960" height="540" alt="페슈의원 메인에서 전체 시술 메뉴를 확대해 선택하고 실제 시술 목록으로 이동하는 화면"></figure>
<div class="tools"><button id="motion" type="button">움직임 멈추기</button><a href="clinic-navigation.gif" download="clinic-navigation.gif">GIF 원본 열기 ↗</a></div><p class="meta">4초 반복 · 실제 사이트 화면 캡처·편집 · 촬영 2026.11.25</p><p class="meta">사이트 출처: <a href="https://pecheskin.clinic/ko" target="_blank" rel="noopener noreferrer">페슈의원 공식 홈페이지</a></p></main>
<nav aria-label="검토 화면 이동"><div><a href="./" id="back">← 뒤로가기</a><a href="./">전체 목록</a></div></nav>
<script>(()=>{const image=document.getElementById('demo'),button=document.getElementById('motion'),pref=matchMedia('(prefers-reduced-motion: reduce)');let playing=!pref.matches;const render=()=>{image.src=playing?'clinic-navigation.gif':'poster.png';button.textContent=playing?'움직임 멈추기':'움직임 재생'};render();button.addEventListener('click',()=>{playing=!playing;render()});pref.addEventListener('change',()=>{playing=!pref.matches;render()});document.getElementById('back').addEventListener('click',event=>{if(!document.referrer)return;const ref=new URL(document.referrer);if(ref.origin===location.origin&&ref.pathname.startsWith('/real-clinic/')&&ref.href!==location.href){event.preventDefault();location.assign(ref.href)}})})();</script></body></html>
