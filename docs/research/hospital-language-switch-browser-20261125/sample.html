<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>피부과 홈페이지 언어 전환 샘플</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:960px;height:540px;overflow:hidden}
    body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Arial,sans-serif;color:#393630;background:#eae7e1;-webkit-font-smoothing:antialiased}
    button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #9a7a55;outline-offset:3px}
    .example{position:absolute;top:7px;left:28px;font-size:10px;letter-spacing:.08em;color:#7d766d}
    #browser{position:absolute;left:24px;top:28px;width:912px;height:480px;background:#fff;border:1px solid #d8d2c9;border-radius:10px;overflow:visible;box-shadow:0 12px 30px #40372c10;transform-origin:100% 0%;will-change:transform}
    .browser-bar{height:30px;border-radius:10px 10px 0 0;background:#f0ede8;border-bottom:1px solid #e4dfd7;display:flex;align-items:center;padding:0 15px;gap:6px}
    .dot{width:7px;height:7px;border-radius:50%;background:#c6bfb5}.address{margin-left:30px;color:#8a8276;font-size:10px;letter-spacing:.025em}
    header{height:78px;padding:0 32px;display:flex;align-items:center;justify-content:space-between;background:#fffefa;border-bottom:1px solid #eae5dc}
    .brand{display:flex;align-items:center;gap:12px;white-space:nowrap;width:230px;flex-shrink:0}.wordmark{font-family:Georgia,"Times New Roman",serif;font-size:25px;font-weight:400;letter-spacing:.1em}.brand-type{border-left:1px solid #c6bba9;padding-left:12px;font-size:10px;line-height:1.5;letter-spacing:.08em;color:#8a7962;max-width:105px}
    .nav{display:flex;align-items:center;gap:19px;color:#605a50;font-size:12px}.nav span{display:block;width:72px;text-align:center;white-space:nowrap}
    .language{position:relative;z-index:4}
    #language-button{width:144px;height:40px;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid #c9bca9;border-radius:3px;color:#514437;background:#fffefa;font-size:16px;font-weight:500}
    #language-button[aria-expanded=true]{border-color:#967854;box-shadow:0 0 0 3px #96785410}
    #language-menu{position:absolute;right:0;top:49px;width:172px;padding:5px;background:#fffefa;border:1px solid #d5c9b7;border-radius:4px;box-shadow:0 10px 28px #45351e26}
    [hidden]{display:none!important}.option{height:42px;width:100%;border:0;border-radius:2px;background:#fffefa;display:flex;align-items:center;justify-content:space-between;padding:0 13px;font-size:16px;color:#514437;text-align:left}
    .option:hover,.option.active{background:#eee7db;color:#624826}.check{color:#8d6d45;font-size:15px}
    main{position:relative;height:371px;overflow:hidden;background:#f6f2eb;border-radius:0 0 10px 10px}
    .hero-photo{position:absolute;right:0;top:0;width:450px;height:371px;object-fit:cover;object-position:40% center}
    .photo-fade{position:absolute;inset:0;background:linear-gradient(90deg,#f6f2eb 47%,#f6f2ebdd 50%,#f6f2eb00 62%);pointer-events:none}
    .hero-copy{position:relative;padding:35px 0 0 46px;z-index:1;width:510px}
    .eyebrow{font-size:9px;letter-spacing:.22em;color:#8a7659;font-weight:500;margin-bottom:16px}
    h1{margin:0;white-space:pre-line;width:450px;height:108px;font-size:39px;line-height:1.35;font-weight:450;letter-spacing:-1.5px}
    html[lang=en] h1{font-family:Georgia,"Times New Roman",serif;font-size:38px;line-height:1.35;letter-spacing:-.8px;font-weight:400}
    .intro{width:425px;height:38px;font-size:12px;line-height:1.65;color:#7a7063;margin:13px 0 13px;white-space:pre-line}
    .booking{height:40px;min-width:150px;border:1px solid #756149;border-radius:1px;padding:0 20px;background:#756149;color:#fffdf8;font-size:12px;font-weight:500;letter-spacing:.015em}
    .booking::after{content:'↗';padding-left:22px;font-size:14px;font-weight:400}
    .treatments{position:relative;display:flex;align-items:center;gap:15px;margin:21px 0 0;font-size:10px;color:#8a7962;letter-spacing:.02em}.treatments span+span::before{content:'/';padding-right:15px;color:#baad99}
    #pointer{position:absolute;z-index:20;left:0;top:0;width:24px;height:30px;pointer-events:none;filter:drop-shadow(0 1px 1px #0002);will-change:transform}
    #ripple{position:absolute;z-index:19;width:28px;height:28px;left:0;top:0;border:1.5px solid #94724c;border-radius:50%;opacity:0;pointer-events:none}
    #replay{position:fixed;right:24px;bottom:10px;background:#fffefa;border:1px solid #d6ccbd;border-radius:3px;height:30px;padding:0 12px;font-size:11px;color:#7c674e}
    html[data-capture=true] #replay{display:none}
  </style>
</head>
<body>
  <div class="example">구성 예시 · SAMPLE WEBSITE</div>
  <div id="browser">
    <div class="browser-bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="address">sample-dermatology.example</span></div>
    <header>
      <div class="brand"><span class="wordmark">SAMPLE</span><span class="brand-type" data-copy="brandType">피부과</span></div>
      <div class="nav"><span data-copy="navCare">피부 진료</span><span data-copy="navTreatments">시술 안내</span><span data-copy="navDoctors">의료진</span></div>
      <div class="language">
        <button id="language-button" aria-label="언어 선택" aria-haspopup="menu" aria-expanded="false"><svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="10" cy="10" r="7.5"/><ellipse cx="10" cy="10" rx="3.2" ry="7.5"/><path d="M3 7h14M3 13h14"/></svg><span id="current-language">한국어</span><svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="m2 4 4 4 4-4"/></svg></button>
        <div id="language-menu" role="menu" aria-label="언어" hidden>
          <button class="option" id="choose-ko" role="menuitem">한국어<span class="check" id="ko-check">✓</span></button>
          <button class="option" id="choose-en" role="menuitem">English<span class="check" id="en-check" hidden>✓</span></button>
        </div>
      </div>
    </header>
    <main>
      <img class="hero-photo" src="dermatology-photo.jpg" alt="피부 관리 스톡 사진" data-copy="photoAlt" data-copy-attribute="alt" width="450" height="371">
      <div class="photo-fade"></div>
      <div class="hero-copy">
        <div class="eyebrow">DERMATOLOGY &amp; AESTHETICS</div>
        <h1 data-copy="heading">피부를 위한,<br>섬세한 진료.</h1>
        <p class="intro" data-copy="intro">피부 고민을 듣고, 나에게 맞는 진료를 함께 찾습니다.</p>
        <button class="booking" data-copy="booking" type="button">상담 예약</button>
        <div class="treatments"><span data-copy="acne">여드름</span><span data-copy="pigmentation">색소</span><span data-copy="lifting">리프팅</span></div>
      </div>
    </main>
  </div>
  <svg id="pointer" width="24" height="30" viewBox="0 0 24 30" aria-hidden="true"><path d="M3 2v23l6-6 4 9 4-2-4-8 8-1Z" fill="white" stroke="#172331" stroke-width="1.5" stroke-linejoin="round"/></svg>
  <div id="ripple"></div>
  <button id="replay" type="button">다시 보기</button>
  <script>
    const copies={ko:{brandType:'피부과',navCare:'피부 진료',navTreatments:'시술 안내',navDoctors:'의료진',heading:['피부를 위한,','섬세한 진료.'].join(String.fromCharCode(10)),intro:'피부 고민을 듣고, 나에게 맞는 진료를 함께 찾습니다.',booking:'상담 예약',acne:'여드름',pigmentation:'색소',lifting:'리프팅',photoAlt:'피부 관리 스톡 사진'},en:{brandType:'DERMATOLOGY',navCare:'Skin Care',navTreatments:'Treatments',navDoctors:'Doctors',heading:['Thoughtful care','for your skin.'].join(String.fromCharCode(10)),intro:'Tell us your skin concerns. Let’s find the right care for you.',booking:'Book a Consultation',acne:'Acne',pigmentation:'Pigmentation',lifting:'Lifting',photoAlt:'Illustrative skin care stock photo'}};
    const browser=document.getElementById('browser'),toggle=document.getElementById('language-button'),menu=document.getElementById('language-menu'),ko=document.getElementById('choose-ko'),en=document.getElementById('choose-en'),pointer=document.getElementById('pointer'),ripple=document.getElementById('ripple');
    let currentLanguage='ko',selectedPoint=null;
    function chooseLanguage(language){currentLanguage=language;document.documentElement.lang=language;document.querySelectorAll('[data-copy]').forEach(el=>{const value=copies[language][el.dataset.copy];if(el.dataset.copyAttribute)el.setAttribute(el.dataset.copyAttribute,value);else el.textContent=value});document.getElementById('current-language').textContent=language==='ko'?'한국어':'English';document.getElementById('ko-check').hidden=language!=='ko';document.getElementById('en-check').hidden=language!=='en';menu.hidden=true;toggle.setAttribute('aria-expanded','false')}
    toggle.addEventListener('click',()=>{menu.hidden=!menu.hidden;toggle.setAttribute('aria-expanded',String(!menu.hidden))});
    ko.addEventListener('click',()=>chooseLanguage('ko'));en.addEventListener('click',()=>chooseLanguage('en'));
    const clamp=v=>Math.max(0,Math.min(1,v));const ease=v=>{v=clamp(v);return v<.5?2*v*v:1-Math.pow(-2*v+2,2)/2};const mix=(a,b,v)=>a+(b-a)*v;
    window.setDemoTime=ms=>{
      ms=Math.max(0,Math.min(3999,ms));
      const scale=ms<1100?mix(1,2,ease((ms-500)/600)):ms<1850?2:mix(2,1,ease((ms-1850)/650));
      browser.style.transform=`scale(${scale})`;
      if(ms<1100){selectedPoint=null;if(currentLanguage!=='ko')ko.click();menu.hidden=true;toggle.setAttribute('aria-expanded','false')}
      else if(ms<1650){if(currentLanguage!=='ko')ko.click();if(menu.hidden)toggle.click()}
      else if(currentLanguage!=='en'){if(menu.hidden)toggle.click();const er=en.getBoundingClientRect();selectedPoint={x:er.x+er.width*.55,y:er.y+er.height*.5};en.click()}
      en.classList.toggle('active',ms>=1450&&ms<1650);
      const tr=toggle.getBoundingClientRect();let x=tr.x+tr.width*.58,y=tr.y+tr.height*.48;
      if(ms<1100){const travel=ease((ms-500)/550);x=mix(590,x,travel);y=mix(373,y,travel)}
      else if(ms<1650){const er=en.getBoundingClientRect(),travel=ease((ms-1160)/350);x=mix(x,er.x+er.width*.55,travel);y=mix(y,er.y+er.height*.5,travel)}
      else {const travel=ease((ms-1770)/650);x=mix(selectedPoint?.x??x,870,travel);y=mix(selectedPoint?.y??y,410,travel)}
      pointer.style.transform=`translate(${x}px,${y}px)`;
      const clickTime=ms>=1650?1650:1100;const phase=(ms-clickTime)/230;
      ripple.style.opacity=phase>=0&&phase<=1?String(.55*(1-phase)):'0';ripple.style.transform=`translate(${x-14}px,${y-14}px) scale(${1+clamp(phase)*.6})`;
      window.demoState={time:ms,language:currentLanguage,menuOpen:!menu.hidden,scale,cursorX:x,cursorY:y};
    };
    let playback=0;
    function play(){cancelAnimationFrame(playback);const start=performance.now();const tick=now=>{const t=now-start;window.setDemoTime(t);if(t<3999)playback=requestAnimationFrame(tick)};playback=requestAnimationFrame(tick)}
    document.getElementById('replay').addEventListener('click',play);
    chooseLanguage('ko');const capture=new URLSearchParams(location.search).has('capture');document.documentElement.dataset.capture=String(capture);window.setDemoTime(0);if(!capture)play();
  </script>
</body>
</html>
